name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run GdUnit4 Tests
    runs-on: ubuntu-latest
    # The action publishes its results as a check run; without checks: write
    # the job fails even when every test passes. Protect main on the
    # `Run GdUnit4 Tests` job check, not `test-results`.
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # godot-version is the full release the dev container runs (godot --version
      # prints 4.7.2.stable). version: installed runs the gdUnit4 committed in
      # addons/ instead of replacing it with the latest release.
      - name: Run GdUnit4 Tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.7.2'
          version: 'installed'
          paths: |
            tests/unit
            tests/integration
          report-name: test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: reports/
